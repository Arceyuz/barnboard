<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Barnboard</title>
    <meta http-equiv="refresh" content="0; url=https://barnboard-wd.netlify.app/" />
    <link rel="canonical" href="https://barnboard-wd.netlify.app/" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #121714;
        color: #e7eee8;
        font-family: system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      p {
        margin: 0 0 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        color: #8aa394;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        min-height: 48px;
        line-height: 48px;
        padding: 0 28px;
        border-radius: 10px;
        background: #8aa394;
        color: #121714;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p>Barnboard</p>
        <a href="https://barnboard-wd.netlify.app/">Open the app</a>
      </div>
    </main>
  </body>
</html>
